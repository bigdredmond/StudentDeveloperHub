<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="/admin/dashboard">Admin Dashboard</a>
        <a href="/admin/logout">Logout</a>
    </nav>

    <section class="topic-section">
        <h1>Admin Dashboard</h1>
        <p>Welcome, Administrator. Manage your learning materials here.</p>

        <h2>Add Study Material</h2>

        <form method="POST" action="/admin/materials">
            <label>Material Title</label>
            <input type="text" name="title" required>

            <label>Description</label>
            <textarea name="description" rows="3" required></textarea>

            <label>Resource Link (URL)</label>
            <input type="url" name="link" placeholder="https://example.com" required>

            <button type="submit">Add Material</button>
        </form>

        <h2>Saved Materials</h2>

        {% for item in materials %}
            <div class="material-card">
                <h3>{{ item["title"] }}</h3>
                <p>{{ item["description"] }}</p>
                <a href="{{ item['link'] }}" target="_blank" rel="noopener noreferrer">Open Resource</a>

                <!-- Edit button -->
                <a href="{{ url_for('edit_material', material_id=item['id']) }}">
                    Edit
                </a>
                
                <!-- Delete button -->
                <form
                    method="POST"
                    action="{{ url_for('delete_material', material_id=item['id']) }}"
                    onsubmit="return confirm('Are you sure you want to delete this material?');"
                >
                    <button type="submit">Delete</button>
                </form>
            </div>
        {% else %}
            <p>No materials added yet.</p>
        {% endfor %}
    </section>
</body>
</html>
